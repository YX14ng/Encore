  zh-TW: "還沒有合輯：播放一些歌曲後，YouTube Music 就會為你製作。"
  hi: "अभी कोई मिक्स नहीं है: कुछ गाने चलाएं, YouTube Music उन्हें बना देगा।"
  es: "Todavía no hay mixes: reproduce algunas canciones y YouTube Music los creará."
  ar: "لا توجد مزيجات بعد: شغّل بعض الأغاني وسينشئها YouTube Music."
  fr: "Pas encore de mix : écoutez quelques titres et YouTube Music en créera."
  bn: "এখনো কোনো মিক্স নেই: কিছু গান চালান, YouTube Music সেগুলো বানিয়ে দেবে।"
  pt-BR: "Ainda não há mixes: toque algumas músicas e o YouTube Music vai criá-los."
  ru: "Миксов пока нет: послушайте несколько треков, и YouTube Music их составит."
  id: "Belum ada mix: putar beberapa lagu dan YouTube Music akan membuatnya."
  de: "Noch keine Mixe: Hör ein paar Songs, dann erstellt YouTube Music welche."
  ja: "ミックスはまだありません。何曲か再生すると YouTube Music が作成します。"
  ko: "아직 믹스가 없습니다. 몇 곡 재생하면 YouTube Music이 만들어 줍니다."
