  pt-BR: "Não foi possível fazer login: %{error}"
  ru: "Не удалось войти: %{error}"
  id: "Tidak dapat login: %{error}"
  de: "Anmeldung fehlgeschlagen: %{error}"
  ja: "ログインできませんでした: %{error}"
  ko: "로그인할 수 없습니다: %{error}"
library.sign_in_window_note:
  en: "Encore opens a small window of its own where you sign in with your Google account, like a browser only Encore uses. Only the YouTube cookies are kept, on this computer."
  zh-CN: "Encore 会打开一个自己的小窗口，供你用 Google 账号登录，就像一个只有 Encore 使用的浏览器。只会保留 YouTube 的 Cookie，且仅保存在这台电脑上。"
  zh-TW: "Encore 會開啟一個專屬的小視窗，讓你用 Google 帳戶登入，就像只有 Encore 使用的瀏覽器。只會保留 YouTube 的 Cookie，而且只存在這台電腦上。"
  hi: "Encore अपनी एक छोटी विंडो खोलता है, जिसमें आप अपने Google खाते से साइन इन करते हैं, जैसे कोई ब्राउज़र जिसे सिर्फ़ Encore इस्तेमाल करता है। सिर्फ़ YouTube की कुकी रखी जाती हैं, वह भी इसी कंप्यूटर पर।"
  es: "Encore abre una ventana pequeña propia donde accedes con tu cuenta de Google, como un navegador que solo usa Encore. Solo se guardan las cookies de YouTube, en esta computadora."
  ar: "يفتح Encore نافذة صغيرة خاصة به تسجّل فيها الدخول بحسابك على Google، كأنها متصفح لا يستخدمه سوى Encore. لا يُحتفظ إلا بملفات تعريف الارتباط الخاصة بـ YouTube، وعلى هذا الكمبيوتر فقط."
  fr: "Encore ouvre sa propre petite fenêtre où vous vous connectez avec votre compte Google, comme un navigateur réservé à Encore. Seuls les cookies YouTube sont conservés, sur cet ordinateur."
  bn: "Encore নিজের একটি ছোট উইন্ডো খোলে, যেখানে আপনি Google অ্যাকাউন্ট দিয়ে সাইন ইন করেন, যেন শুধু Encore-এর জন্য একটি ব্রাউজার। শুধু YouTube-এর কুকি রাখা হয়, এই কম্পিউটারেই।"
  pt-BR: "O Encore abre uma pequena janela própria onde você faz login com sua Conta do Google, como um navegador que só o Encore usa. Só os cookies do YouTube são guardados, neste computador."
  ru: "Encore открывает собственное небольшое окно, где вы входите в аккаунт Google, — как браузер, которым пользуется только Encore. Сохраняются только файлы cookie YouTube, и только на этом компьютере."
  id: "Encore membuka jendela kecilnya sendiri tempat Anda login dengan Akun Google, seperti browser yang hanya dipakai Encore. Hanya cookie YouTube yang disimpan, di komputer ini."
  de: "Encore öffnet ein eigenes kleines Fenster, in dem du dich mit deinem Google-Konto anmeldest – wie ein Browser, den nur Encore nutzt. Gespeichert werden nur die YouTube-Cookies, auf diesem Computer."
  ja: "Encore は専用の小さなウィンドウを開き、そこで Google アカウントにログインします。Encore 専用のブラウザのようなものです。保存されるのは YouTube の Cookie だけで、保存先はこのパソコン内です。"
  ko: "Encore는 Encore만 쓰는 브라우저 같은 작은 창을 따로 열고, 그 창에서 Google 계정으로 로그인합니다. YouTube 쿠키만 이 컴퓨터에 저장됩니다."
library.browser_note:
  en: "Or read the session from a browser you are signed in to. It stops working when that browser renews it, often within minutes:"
  zh-CN: "也可以从已登录的浏览器读取会话。浏览器一旦续期该会话，它就会失效，通常只需几分钟："
  zh-TW: "也可以從已登入的瀏覽器讀取工作階段。瀏覽器一旦更新該工作階段，它就會失效，通常只要幾分鐘："
  hi: "या किसी ऐसे ब्राउज़र से सेशन पढ़ें जिसमें आप साइन इन हैं। जब वह ब्राउज़र इसे रिन्यू करता है, तो यह काम करना बंद कर देता है, अक्सर कुछ ही मिनटों में:"
  es: "O lee la sesión de un navegador donde ya accediste. Deja de funcionar cuando ese navegador la renueva, a menudo en cuestión de minutos:"
  ar: "أو اقرأ الجلسة من متصفح سجّلت الدخول فيه. تتوقف عن العمل حين يجدّدها ذلك المتصفح، وكثيرًا ما يحدث ذلك خلال دقائق:"
  fr: "Ou lisez la session d'un navigateur où vous êtes connecté. Elle cesse de fonctionner dès que ce navigateur la renouvelle, souvent en quelques minutes :"
  bn: "অথবা যে ব্রাউজারে আপনি সাইন ইন করা আছেন, সেখান থেকে সেশনটি পড়ুন। সেই ব্রাউজার এটি নবায়ন করলেই এটি আর কাজ করে না, প্রায়ই কয়েক মিনিটের মধ্যে:"
  pt-BR: "Ou leia a sessão de um navegador em que você está conectado. Ela para de funcionar quando esse navegador a renova, muitas vezes em poucos minutos:"
  ru: "Или прочитайте сеанс из браузера, в котором вы вошли в аккаунт. Он перестанет работать, когда браузер его обновит, — часто уже через несколько минут:"
  id: "Atau baca sesi dari browser tempat Anda sudah login. Sesi itu berhenti berfungsi saat browser memperbaruinya, sering kali dalam hitungan menit:"
  de: "Oder lies die Sitzung aus einem Browser, in dem du angemeldet bist. Sie funktioniert nicht mehr, sobald der Browser sie erneuert, oft schon nach wenigen Minuten:"
  ja: "または、ログイン済みのブラウザからセッションを読み込みます。そのブラウザがセッションを更新すると使えなくなります（数分で更新されることも珍しくありません）："
  ko: "또는 로그인된 브라우저에서 세션을 읽어 옵니다. 그 브라우저가 세션을 갱신하면 더 이상 작동하지 않으며, 몇 분 안에 갱신되는 경우가 많습니다:"
library.cookies_note:
  en: "Or import a cookies.txt. Export it from a private window and close the window, so the browser never renews it:"
  zh-CN: "或者导入 cookies.txt。请在无痕窗口中导出，然后关闭该窗口，这样浏览器就不会续期它："
  zh-TW: "或者匯入 cookies.txt。請在無痕視窗中匯出，然後關閉該視窗，這樣瀏覽器就不會更新它："
  hi: "या cookies.txt इंपोर्ट करें। इसे किसी प्राइवेट विंडो से एक्सपोर्ट करें और विंडो बंद कर दें, ताकि ब्राउज़र इसे कभी रिन्यू न करे:"
  es: "O importa un cookies.txt. Expórtalo desde una ventana privada y cierra la ventana, para que el navegador nunca lo renueve:"
  ar: "أو استورد ملف cookies.txt. صدّره من نافذة خاصة ثم أغلق النافذة، حتى لا يجدّده المتصفح أبدًا:"
  fr: "Ou importez un cookies.txt. Exportez-le depuis une fenêtre de navigation privée, puis fermez-la pour que le navigateur ne le renouvelle jamais :"
  bn: "অথবা একটি cookies.txt ইমপোর্ট করুন। এটি একটি প্রাইভেট উইন্ডো থেকে এক্সপোর্ট করে উইন্ডোটি বন্ধ করুন, যাতে ব্রাউজার এটি কখনো নবায়ন না করে:"
  pt-BR: "Ou importe um cookies.txt. Exporte-o de uma janela anônima e feche a janela, para que o navegador nunca o renove:"
  ru: "Или импортируйте cookies.txt. Экспортируйте его из приватного окна и закройте это окно, чтобы браузер его не обновил:"
  id: "Atau impor cookies.txt. Ekspor dari jendela pribadi lalu tutup jendelanya, agar browser tidak pernah memperbaruinya:"
  de: "Oder importiere eine cookies.txt. Exportiere sie aus einem privaten Fenster und schließe das Fenster, damit der Browser sie nie erneuert:"
  ja: "または cookies.txt をインポートします。プライベート ウィンドウからエクスポートしてそのウィンドウを閉じれば、ブラウザにセッションを更新されることはありません："
  ko: "또는 cookies.txt를 가져옵니다. 시크릿 창에서 내보낸 뒤 창을 닫으면 브라우저가 갱신하지 않습니다:"
