library.waiting:
  en: "Sign in with your Google account in the window Encore opened. It closes on its own once YouTube Music opens signed in."
  zh-CN: "请在 Encore 打开的窗口中用你的 Google 账号登录。YouTube Music 以登录状态打开后，窗口会自动关闭。"
  zh-TW: "請在 Encore 開啟的視窗中用你的 Google 帳戶登入。YouTube Music 以登入狀態開啟後，視窗會自動關閉。"
  hi: "Encore की खोली गई विंडो में अपने Google खाते से साइन इन करें। YouTube Music साइन इन होकर खुलते ही यह विंडो अपने-आप बंद हो जाएगी।"
  es: "Accede con tu cuenta de Google en la ventana que abrió Encore. Se cierra sola cuando YouTube Music se abre con tu sesión iniciada."
  ar: "سجّل الدخول بحسابك على Google في النافذة التي فتحها Encore. ستُغلق تلقائيًا بمجرد أن يفتح YouTube Music وأنت مسجّل الدخول."
  fr: "Connectez-vous avec votre compte Google dans la fenêtre ouverte par Encore. Elle se ferme d'elle-même dès que YouTube Music s'ouvre en étant connecté."
  bn: "Encore যে উইন্ডোটি খুলেছে, সেখানে আপনার Google অ্যাকাউন্ট দিয়ে সাইন ইন করুন। সাইন ইন অবস্থায় YouTube Music খুললেই এটি নিজে থেকে বন্ধ হয়ে যাবে।"
  pt-BR: "Faça login com sua Conta do Google na janela que o Encore abriu. Ela fecha sozinha quando o YouTube Music abrir com o login feito."
  ru: "Войдите в аккаунт Google в окне, которое открыл Encore. Оно закроется само, как только YouTube Music откроется с выполненным входом."
  id: "Login dengan Akun Google Anda di jendela yang dibuka Encore. Jendela itu akan tertutup sendiri setelah YouTube Music terbuka dalam keadaan login."
  de: "Melde dich in dem Fenster, das Encore geöffnet hat, mit deinem Google-Konto an. Es schließt sich von selbst, sobald YouTube Music angemeldet geöffnet ist."
  ja: "Encore が開いたウィンドウで Google アカウントにログインしてください。YouTube Music がログイン状態で開くと、ウィンドウは自動的に閉じます。"
  ko: "Encore가 연 창에서 Google 계정으로 로그인하세요. YouTube Music이 로그인된 상태로 열리면 창이 자동으로 닫힙니다."
