settings.accent_cover_note:
  en: The accent changes with each song's cover.
  zh-CN: 强调色会随每首歌的封面变化。
  zh-TW: 強調色會隨每首歌的封面變化。
  hi: एक्सेंट हर गाने के कवर के साथ बदलता है।
  es: El acento cambia con la portada de cada canción.
  ar: يتغير لون التمييز مع غلاف كل أغنية.
  fr: L'accent change avec la pochette de chaque titre.
  bn: প্রতিটি গানের কভারের সাথে অ্যাকসেন্ট বদলায়।
  pt-BR: O destaque muda com a capa de cada música.
  ru: Акцентный цвет меняется вместе с обложкой каждого трека.
  id: Aksen berubah mengikuti sampul setiap lagu.
  it: Il colore di risalto cambia con la copertina di ogni brano.
  de: Die Akzentfarbe wechselt mit dem Cover jedes Songs.
  ja: アクセントカラーが曲のジャケットに合わせて変わります。
  ko: 강조 색상이 곡마다 커버에 맞춰 바뀝니다.
