settings.custom_themes_note:
  en: 'Add your own themes as JSON files in %{folder}. Colors are #rrggbb; the ones left out come from Encore''s dark theme, or from Daylight with "light": true.'
  zh-CN: '将自定义主题以 JSON 文件放在 %{folder}。颜色格式为 #rrggbb；未填写的颜色取自 Encore 的深色主题，若设置 "light": true 则取自 Daylight。'
  zh-TW: '將自訂主題以 JSON 檔案放在 %{folder}。顏色格式為 #rrggbb；未填寫的顏色取自 Encore 的深色主題，若設定 "light": true 則取自 Daylight。'
  hi: 'अपनी थीम JSON फ़ाइलों के रूप में %{folder} में जोड़ें। रंग #rrggbb होते हैं; छोड़े गए रंग Encore की डार्क थीम से, या "light": true होने पर Daylight से आते हैं।'
  es: 'Agrega tus temas como archivos JSON en %{folder}. Los colores van como #rrggbb; los que falten se toman del tema oscuro de Encore, o de Daylight con "light": true.'
  ar: 'أضف سماتك كملفات JSON في %{folder}. الألوان بصيغة #rrggbb؛ وما لم يُحدَّد منها يُؤخذ من سمة Encore الداكنة، أو من Daylight مع "light": true.'
  fr: 'Ajoutez vos thèmes en fichiers JSON dans %{folder}. Les couleurs sont au format #rrggbb ; celles qui manquent viennent du thème sombre d''Encore, ou de Daylight avec "light": true.'
  bn: 'নিজের থিম JSON ফাইল হিসেবে %{folder}-এ যোগ করুন। রং #rrggbb আকারে; বাদ পড়া রংগুলো Encore-এর ডার্ক থিম থেকে, বা "light": true থাকলে Daylight থেকে আসে।'
  pt-BR: 'Adicione seus temas como arquivos JSON em %{folder}. As cores são #rrggbb; as que faltarem vêm do tema escuro do Encore, ou do Daylight com "light": true.'
  ru: 'Добавляйте свои темы в виде JSON-файлов в папку %{folder}. Цвета — в формате #rrggbb; недостающие берутся из тёмной темы Encore или из Daylight при "light": true.'
  id: 'Tambahkan tema sendiri sebagai file JSON di %{folder}. Warna ditulis #rrggbb; yang tidak diisi diambil dari tema gelap Encore, atau dari Daylight dengan "light": true.'
  it: 'Aggiungi i tuoi temi come file JSON in %{folder}. I colori sono nel formato #rrggbb; quelli mancanti vengono presi dal tema scuro di Encore, o da Daylight con "light": true.'
  de: 'Lege eigene Designs als JSON-Dateien in %{folder} ab. Farben sind #rrggbb; fehlende kommen aus Encores dunklem Design oder mit "light": true aus Daylight.'
  ja: '独自のテーマは JSON ファイルとして %{folder} に置くと追加できます。色は #rrggbb 形式で、省いた色には Encore のダークテーマ（"light": true なら Daylight）の色が使われます。'
  ko: '%{folder}에 JSON 파일을 넣으면 사용자 테마를 추가할 수 있습니다. 색상은 #rrggbb 형식이며, 생략한 색은 Encore의 어두운 테마("light": true이면 Daylight)에서 가져옵니다.'
