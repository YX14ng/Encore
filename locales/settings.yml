settings.language_note:
  en: YouTube Music's own texts (Explore, the names of mixes) follow on the next start.
  zh-CN: YouTube Music 自身的文字（探索、合辑名称）将在下次启动时切换。
  zh-TW: YouTube Music 本身的文字（探索、合輯名稱）會在下次啟動時切換。
  hi: YouTube Music के अपने टेक्स्ट (एक्सप्लोर, मिक्स के नाम) अगली बार शुरू करने पर बदलेंगे।
  es: Los textos propios de YouTube Music (Explorar, los nombres de los mixes) cambian en el próximo inicio.
  ar: تتغير نصوص YouTube Music نفسها (استكشاف وأسماء المزيجات) عند التشغيل التالي.
  fr: Les textes de YouTube Music (Explorer, les noms des mix) suivront au prochain démarrage.
  bn: YouTube Music-এর নিজস্ব লেখা (এক্সপ্লোর, মিক্সের নাম) পরের বার চালু করলে বদলাবে।
  pt-BR: Os textos do próprio YouTube Music (Explorar, os nomes dos mixes) mudam na próxima vez que abrir.
  ru: Тексты самого YouTube Music (Навигатор, названия миксов) сменятся при следующем запуске.
  id: Teks milik YouTube Music (Jelajahi, nama mix) ikut berubah saat dibuka berikutnya.
  it: I testi di YouTube Music (Esplora, i nomi dei mix) si aggiorneranno al prossimo avvio.
  de: Die Texte von YouTube Music selbst (Entdecken, die Namen der Mixe) folgen beim nächsten Start.
  ja: YouTube Music 側の表示（探索、ミックス名）は次回の起動から切り替わります。
  ko: YouTube Music 자체의 텍스트(둘러보기, 믹스 이름)는 다음 실행부터 바뀝니다.
