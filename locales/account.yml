scrobbler.missing_keys:
  en: "Scrobbling is off: %{error}. Set both variables to your Last.fm API account and restart Encore."
  zh-CN: "播放记录同步已关闭：%{error}。请将这两个变量设置为你的 Last.fm API 账号，然后重启 Encore。"
  zh-TW: "播放記錄同步已關閉：%{error}。請將這兩個變數設為你的 Last.fm API 帳戶，然後重新啟動 Encore。"
  hi: "स्क्रॉबलिंग बंद है: %{error}। दोनों वेरिएबल अपने Last.fm API खाते पर सेट करें और Encore को फिर से शुरू करें।"
  es: "El scrobbling está desactivado: %{error}. Define ambas variables con tu cuenta de la API de Last.fm y reinicia Encore."
  ar: "تسجيل الاستماع متوقف: %{error}. عيّن المتغيّرين لحساب Last.fm API الخاص بك ثم أعد تشغيل Encore."
  fr: "Le scrobbling est désactivé : %{error}. Définissez les deux variables avec votre compte API Last.fm, puis redémarrez Encore."
  bn: "স্ক্রবলিং বন্ধ আছে: %{error}। দুটি ভেরিয়েবলই আপনার Last.fm API অ্যাকাউন্টে সেট করুন এবং Encore আবার চালু করুন।"
  pt-BR: "O scrobbling está desativado: %{error}. Defina as duas variáveis com sua conta da API do Last.fm e reinicie o Encore."
  ru: "Скробблинг выключен: %{error}. Задайте обе переменные для своего API-аккаунта Last.fm и перезапустите Encore."
  id: "Scrobbling nonaktif: %{error}. Atur kedua variabel ke akun API Last.fm Anda, lalu mulai ulang Encore."
  de: "Scrobbeln ist aus: %{error}. Setze beide Variablen auf dein Last.fm-API-Konto und starte Encore neu."
  ja: "Scrobble はオフです: %{error}。両方の変数に Last.fm API アカウントの値を設定して、Encore を再起動してください。"
  ko: "스크로블이 꺼져 있습니다: %{error}. 두 변수를 Last.fm API 계정 값으로 설정한 뒤 Encore를 다시 시작하세요."
scrobbler.connect_note:
  en: "Connect Last.fm to scrobble the songs you play in Encore."
  zh-CN: "连接 Last.fm 后，你在 Encore 中播放的歌曲会同步到 Last.fm 的播放记录。"
  zh-TW: "連結 Last.fm 後，你在 Encore 中播放的歌曲會同步到 Last.fm 的播放記錄。"
  hi: "Encore में चलाए गए गानों को स्क्रॉबल करने के लिए Last.fm कनेक्ट करें।"
  es: "Conecta Last.fm para hacer scrobble de las canciones que reproduces en Encore."
  ar: "اربط Last.fm لتسجيل الأغاني التي تستمع إليها في Encore."
  fr: "Connectez Last.fm pour scrobbler les titres que vous écoutez dans Encore."
  bn: "Encore-এ যে গান বাজান সেগুলো স্ক্রবল করতে Last.fm সংযুক্ত করুন।"
  pt-BR: "Conecte o Last.fm para fazer scrobble das músicas que você toca no Encore."
  ru: "Подключите Last.fm, чтобы скробблить песни, которые вы слушаете в Encore."
