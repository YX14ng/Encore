together.port_note:
  en: "Friends on the internet need your router to forward this port to this computer, as for a game server."
  zh-CN: "如果朋友通过互联网连接，需要像搭建游戏服务器那样，在路由器上把这个端口转发到这台电脑。"
  zh-TW: "如果朋友透過網際網路連線，需要像架設遊戲伺服器一樣，在路由器上把這個連接埠轉送到這台電腦。"
  hi: "इंटरनेट पर मौजूद दोस्तों के लिए, गेम सर्वर की तरह, आपके राउटर को यह पोर्ट इस कंप्यूटर पर फ़ॉरवर्ड करना होगा।"
  es: "Para amigos en internet, tu router tiene que redirigir este puerto a esta computadora, como para un servidor de juegos."
  ar: "ليتصل أصدقاؤك عبر الإنترنت، يجب أن يعيد الموجّه توجيه هذا المنفذ إلى هذا الكمبيوتر، كما في خوادم الألعاب."
  fr: "Pour vos amis sur Internet, votre routeur doit rediriger ce port vers cet ordinateur, comme pour un serveur de jeu."
  bn: "ইন্টারনেটে থাকা বন্ধুদের জন্য, গেম সার্ভারের মতোই, আপনার রাউটারকে এই পোর্টটি এই কম্পিউটারে ফরওয়ার্ড করতে হবে।"
  pt-BR: "Para amigos na internet, seu roteador precisa encaminhar esta porta para este computador, como em um servidor de jogos."
  ru: "Чтобы друзья подключались через интернет, роутер должен перенаправлять этот порт на этот компьютер, как для игрового сервера."
  id: "Agar teman di internet bisa terhubung, router Anda perlu meneruskan port ini ke komputer ini, seperti untuk server game."
  de: "Für Freunde im Internet muss dein Router diesen Port an diesen Computer weiterleiten, wie bei einem Spieleserver."
  ja: "インターネット経由の友だちのために、ゲーム サーバーと同じように、ルーターでこのポートをこのパソコンに転送してください。"
  ko: "인터넷으로 접속하는 친구를 위해서는 게임 서버처럼 공유기에서 이 포트를 이 컴퓨터로 포워딩해야 합니다."
