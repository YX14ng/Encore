together.address_not_found:
  en: "Could not find your public address (%{error}). Type it in instead."
  zh-CN: "无法查找到你的公网地址（%{error}）。请手动输入。"
  zh-TW: "無法找到你的公開位址（%{error}）。請改為手動輸入。"
  hi: "आपका सार्वजनिक पता नहीं मिला (%{error})। इसके बजाय इसे खुद टाइप करें।"
  es: "No se pudo encontrar tu dirección pública (%{error}). Escríbela a mano."
  ar: "تعذّر العثور على عنوانك العام (%{error}). اكتبه بنفسك بدلًا من ذلك."
  fr: "Impossible de trouver votre adresse publique (%{error}). Saisissez-la vous-même."
  bn: "আপনার পাবলিক ঠিকানা পাওয়া যায়নি (%{error})। এর বদলে নিজে টাইপ করুন।"
  pt-BR: "Não foi possível encontrar seu endereço público (%{error}). Digite-o manualmente."
  ru: "Не удалось определить ваш внешний адрес (%{error}). Введите его вручную."
  id: "Tidak dapat menemukan alamat publik Anda (%{error}). Ketik secara manual."
  de: "Deine öffentliche Adresse wurde nicht gefunden (%{error}). Gib sie stattdessen selbst ein."
  ja: "グローバル アドレスを確認できませんでした（%{error}）。手動で入力してください。"
  ko: "공인 주소를 찾을 수 없습니다(%{error}). 직접 입력하세요."
together.end_before_joining:
  en: "End your own session before joining a friend's from Discord."
  zh-CN: "从 Discord 加入朋友的会话前，请先结束你自己的会话。"
  zh-TW: "從 Discord 加入朋友的工作階段前，請先結束你自己的工作階段。"
  hi: "Discord से किसी दोस्त के सेशन से जुड़ने से पहले अपना सेशन खत्म करें।"
  es: "Termina tu propia sesión antes de unirte a la de un amigo desde Discord."
  ar: "أنهِ جلستك أولًا قبل الانضمام إلى جلسة صديق من Discord."
  fr: "Mettez fin à votre propre session avant de rejoindre celle d'un ami depuis Discord."
  bn: "Discord থেকে বন্ধুর সেশনে যোগ দেওয়ার আগে নিজের সেশন শেষ করুন।"
  pt-BR: "Encerre sua própria sessão antes de entrar na de um amigo pelo Discord."
  ru: "Завершите свой сеанс, прежде чем присоединяться к сеансу друга через Discord."
  id: "Akhiri sesi Anda sendiri sebelum bergabung ke sesi teman dari Discord."
  de: "Beende deine eigene Sitzung, bevor du über Discord der Sitzung eines Freundes beitrittst."
  ja: "Discord から友だちのセッションに参加する前に、自分のセッションを終了してください。"
  ko: "Discord에서 친구의 세션에 참여하기 전에 내 세션을 먼저 종료하세요."
together.bad_port:
  en: "The port must be a number from 1 to 65535."
  zh-CN: "端口必须是 1 到 65535 之间的数字。"
  zh-TW: "連接埠必須是 1 到 65535 之間的數字。"
  hi: "पोर्ट 1 से 65535 के बीच की संख्या होनी चाहिए।"
  es: "El puerto debe ser un número del 1 al 65535."
  ar: "يجب أن يكون المنفذ رقمًا من 1 إلى 65535."
  fr: "Le port doit être un nombre compris entre 1 et 65535."
  bn: "পোর্ট অবশ্যই 1 থেকে 65535-এর মধ্যে একটি সংখ্যা হতে হবে।"
  pt-BR: "A porta precisa ser um número de 1 a 65535."
  ru: "Порт должен быть числом от 1 до 65535."
  id: "Port harus berupa angka dari 1 sampai 65535."
  de: "Der Port muss eine Zahl von 1 bis 65535 sein."
  ja: "ポートは 1〜65535 の数字で指定してください。"
  ko: "포트는 1부터 65535 사이의 숫자여야 합니다."
together.bad_address:
  en: "The address must be a host name, an IPv4 address or an IPv6 address in brackets."
  zh-CN: "地址必须是主机名、IPv4 地址或用方括号括起来的 IPv6 地址。"
  zh-TW: "位址必須是主機名稱、IPv4 位址或以方括號括住的 IPv6 位址。"
  hi: "पता कोई होस्ट नाम, IPv4 पता या ब्रैकेट में लिखा IPv6 पता होना चाहिए।"
  es: "La dirección debe ser un nombre de host, una dirección IPv4 o una dirección IPv6 entre corchetes."
  ar: "يجب أن يكون العنوان اسم مضيف أو عنوان IPv4 أو عنوان IPv6 بين قوسين معقوفين."
  fr: "L'adresse doit être un nom d'hôte, une adresse IPv4 ou une adresse IPv6 entre crochets."
  bn: "ঠিকানাটি অবশ্যই একটি হোস্ট নাম, একটি IPv4 ঠিকানা বা বন্ধনীর ভেতরে একটি IPv6 ঠিকানা হতে হবে।"
  pt-BR: "O endereço precisa ser um nome de host, um endereço IPv4 ou um endereço IPv6 entre colchetes."
  ru: "Адрес должен быть именем хоста, IPv4-адресом или IPv6-адресом в квадратных скобках."
  id: "Alamat harus berupa nama host, alamat IPv4, atau alamat IPv6 di dalam tanda kurung siku."
  de: "Die Adresse muss ein Hostname, eine IPv4-Adresse oder eine IPv6-Adresse in eckigen Klammern sein."
  ja: "アドレスはホスト名、IPv4 アドレス、または角かっこで囲んだ IPv6 アドレスで指定してください。"
  ko: "주소는 호스트 이름, IPv4 주소 또는 대괄호로 묶은 IPv6 주소여야 합니다."
together.not_an_address:
  en: "the answer was not an address"
  zh-CN: "返回的内容不是地址"
  zh-TW: "回應的內容不是位址"
  hi: "जवाब कोई पता नहीं था"
  es: "la respuesta no era una dirección"
  ar: "لم تكن الاستجابة عنوانًا"
  fr: "la réponse n'était pas une adresse"
  bn: "উত্তরটি কোনো ঠিকানা ছিল না"
  pt-BR: "a resposta não era um endereço"
  ru: "в ответе не было адреса"
  id: "jawabannya bukan alamat"
  de: "die Antwort war keine Adresse"
  ja: "応答がアドレスではありませんでした"
  ko: "응답이 주소가 아니었습니다"
together.unreachable:
  en: "Could not reach the host: %{error}."
  zh-CN: "无法连接到主持人：%{error}。"
  zh-TW: "無法連線到主持人：%{error}。"
  hi: "होस्ट तक नहीं पहुँच सके: %{error}।"
  es: "No se pudo conectar con el anfitrión: %{error}."
  ar: "تعذّر الوصول إلى المضيف: %{error}."
  fr: "Impossible de joindre l'hôte : %{error}."
  bn: "হোস্টের কাছে পৌঁছানো যায়নি: %{error}।"
  pt-BR: "Não foi possível alcançar o anfitrião: %{error}."
  ru: "Не удалось связаться с ведущим: %{error}."
  id: "Tidak dapat menjangkau host: %{error}."
  de: "Der Host ist nicht erreichbar: %{error}."
  ja: "ホストに接続できませんでした: %{error}。"
  ko: "호스트에 연결할 수 없습니다: %{error}."
together.no_answer:
  en: "The host did not answer."
  zh-CN: "主持人没有响应。"
  zh-TW: "主持人沒有回應。"
  hi: "होस्ट ने जवाब नहीं दिया।"
  es: "El anfitrión no respondió."
  ar: "لم يستجب المضيف."
  fr: "L'hôte n'a pas répondu."
  bn: "হোস্ট সাড়া দেননি।"
  pt-BR: "O anfitrião não respondeu."
  ru: "Ведущий не ответил."
  id: "Host tidak menjawab."
  de: "Der Host hat nicht geantwortet."
  ja: "ホストから応答がありません。"
  ko: "호스트가 응답하지 않았습니다."
together.connection_lost:
  en: "Lost the connection to the host: %{error}."
  zh-CN: "与主持人的连接已断开：%{error}。"
  zh-TW: "與主持人的連線已中斷：%{error}。"
  hi: "होस्ट से कनेक्शन टूट गया: %{error}।"
  es: "Se perdió la conexión con el anfitrión: %{error}."
  ar: "انقطع الاتصال بالمضيف: %{error}."
  fr: "Connexion à l'hôte perdue : %{error}."
  bn: "হোস্টের সাথে সংযোগ বিচ্ছিন্ন হয়েছে: %{error}।"
  pt-BR: "A conexão com o anfitrião caiu: %{error}."
  ru: "Соединение с ведущим потеряно: %{error}."
  id: "Koneksi ke host terputus: %{error}."
  de: "Die Verbindung zum Host ist abgebrochen: %{error}."
  ja: "ホストとの接続が切れました: %{error}。"
  ko: "호스트와의 연결이 끊겼습니다: %{error}."
together.host_ended:
  en: "The host ended the session."
  zh-CN: "主持人已结束会话。"
  zh-TW: "主持人已結束工作階段。"
  hi: "होस्ट ने सेशन खत्म कर दिया।"
  es: "El anfitrión terminó la sesión."
  ar: "أنهى المضيف الجلسة."
  fr: "L'hôte a mis fin à la session."
  bn: "হোস্ট সেশন শেষ করেছেন।"
  pt-BR: "O anfitrião encerrou a sessão."
  ru: "Ведущий завершил сеанс."
  id: "Host mengakhiri sesi."
  de: "Der Host hat die Sitzung beendet."
  ja: "ホストがセッションを終了しました。"
  ko: "호스트가 세션을 종료했습니다."
together.port_failed:
