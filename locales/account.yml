together.listening_note:
  en: "Encore plays what they play. Your own controls work, but the host's next change wins."
  zh-CN: "Encore 会播放对方正在播放的内容。你仍可以自己操作，但主持人的下一次操作会覆盖你的更改。"
  zh-TW: "Encore 會播放對方正在播放的內容。你仍可以自己操作，但主持人的下一次操作會蓋過你的變更。"
  hi: "Encore वही चलाता है जो वे चलाते हैं। आपके अपने कंट्रोल काम करते हैं, लेकिन होस्ट का अगला बदलाव ही लागू होगा।"
  es: "Encore reproduce lo que reproduce el anfitrión. Tus controles funcionan, pero el próximo cambio del anfitrión manda."
  ar: "يشغّل Encore ما يشغّله المضيف. تعمل عناصر التحكم الخاصة بك، لكن التغيير التالي من المضيف هو الذي يسري."
  fr: "Encore joue ce que l'hôte joue. Vos commandes fonctionnent, mais le prochain changement de l'hôte l'emporte."
  bn: "হোস্ট যা বাজান Encore তা-ই বাজায়। আপনার নিজের নিয়ন্ত্রণ কাজ করে, তবে হোস্টের পরের পরিবর্তনটাই কার্যকর হয়।"
  pt-BR: "O Encore toca o que o anfitrião toca. Seus controles funcionam, mas a próxima mudança do anfitrião prevalece."
  ru: "Encore воспроизводит то же, что и ведущий. Ваши кнопки работают, но следующее действие ведущего важнее."
  id: "Encore memutar apa yang diputar host. Kontrol Anda tetap berfungsi, tetapi perubahan berikutnya dari host yang berlaku."
  de: "Encore spielt, was der Host spielt. Deine eigenen Steuerelemente funktionieren, aber die nächste Änderung des Hosts hat Vorrang."
  ja: "Encore はホストが再生している曲を再生します。自分でも操作できますが、ホストが次に操作するとそちらが優先されます。"
  ko: "Encore는 호스트가 재생하는 음악을 재생합니다. 직접 조작할 수도 있지만 호스트가 다음에 바꾸면 그 내용이 우선합니다."
