together.intro:
  en: "Friends hear what you play, in sync. Each Encore downloads the songs on its own; only the song and the position travel."
  zh-CN: "朋友会同步听到你正在播放的内容。每个 Encore 各自下载歌曲，传输的只有歌曲信息和播放位置。"
  zh-TW: "朋友會同步聽到你正在播放的內容。每個 Encore 各自下載歌曲，傳送的只有歌曲資訊和播放位置。"
  hi: "दोस्त वही सुनते हैं जो आप चलाते हैं, एक साथ। हर Encore गाने खुद डाउनलोड करता है; सिर्फ़ गाना और उसकी पोज़िशन भेजी जाती है।"
  es: "Tus amigos escuchan lo que reproduces, sincronizados. Cada Encore descarga las canciones por su cuenta; solo se envían la canción y la posición."
  ar: "يسمع أصدقاؤك ما تشغّله بشكل متزامن. يُنزّل كل Encore الأغاني بنفسه؛ ولا يُرسَل سوى الأغنية وموضع التشغيل."
  fr: "Vos amis entendent ce que vous écoutez, en synchro. Chaque Encore télécharge les titres de son côté ; seuls le titre et la position transitent."
  bn: "আপনি যা বাজান বন্ধুরা তা একসাথে শুনতে পায়। প্রতিটি Encore নিজে গান ডাউনলোড করে; শুধু গান আর তার অবস্থান পাঠানো হয়।"
  pt-BR: "Seus amigos ouvem o que você toca, em sincronia. Cada Encore baixa as músicas por conta própria; só a música e a posição são enviadas."
  ru: "Друзья слышат то же, что и вы, синхронно. Каждый Encore сам загружает песни; передаются только песня и позиция."
  id: "Teman mendengar apa yang Anda putar secara bersamaan. Setiap Encore mengunduh lagunya sendiri; yang dikirim hanya lagu dan posisinya."
  de: "Freunde hören synchron, was du spielst. Jedes Encore lädt die Songs selbst herunter; übertragen werden nur der Song und die Position."
  ja: "あなたが再生している曲を、友だちも同時に聴けます。曲はそれぞれの Encore がダウンロードし、送られるのは曲と再生位置だけです。"
  ko: "친구들이 내가 재생하는 음악을 동시에 듣습니다. 노래는 각 Encore가 직접 다운로드하고, 전송되는 것은 노래와 재생 위치뿐입니다."
