scrobbler.approve:
  en: "Approve Encore on the Last.fm page that opened in your browser; Encore notices on its own within a few seconds."
  zh-CN: "请在浏览器中打开的 Last.fm 页面上授权 Encore；Encore 会在几秒内自动检测到。"
  zh-TW: "請在瀏覽器中開啟的 Last.fm 頁面上授權 Encore；Encore 會在幾秒內自動偵測到。"
  hi: "आपके ब्राउज़र में खुले Last.fm पेज पर Encore को मंज़ूरी दें; Encore कुछ ही सेकंड में अपने-आप पहचान लेगा।"
  es: "Autoriza Encore en la página de Last.fm que se abrió en tu navegador; Encore lo detectará solo en unos segundos."
  ar: "وافق على Encore في صفحة Last.fm التي فُتحت في متصفحك؛ سيلاحظ Encore ذلك تلقائيًا خلال ثوانٍ."
  fr: "Autorisez Encore sur la page Last.fm ouverte dans votre navigateur ; Encore s'en rend compte tout seul en quelques secondes."
  bn: "আপনার ব্রাউজারে খোলা Last.fm পেজে Encore অনুমোদন করুন; কয়েক সেকেন্ডের মধ্যে Encore নিজেই তা বুঝে নেবে।"
  pt-BR: "Autorize o Encore na página do Last.fm que abriu no seu navegador; o Encore percebe sozinho em poucos segundos."
  ru: "Разрешите доступ Encore на странице Last.fm, открывшейся в браузере; Encore заметит это сам за несколько секунд."
  id: "Setujui Encore di halaman Last.fm yang terbuka di browser Anda; Encore akan mendeteksinya sendiri dalam beberapa detik."
  de: "Erlaube Encore auf der Last.fm-Seite, die sich in deinem Browser geöffnet hat; Encore bemerkt das innerhalb weniger Sekunden von selbst."
  ja: "ブラウザで開いた Last.fm のページで Encore を承認してください。数秒以内に Encore が自動で検知します。"
  ko: "브라우저에 열린 Last.fm 페이지에서 Encore를 승인하세요. 몇 초 안에 Encore가 자동으로 알아챕니다."
