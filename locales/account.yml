together.invite_note:
  en: "Send the invite to your friends, or let them join from your Discord profile. They connect straight to this computer, so they see its address, and you see theirs."
  zh-CN: "把邀请发给朋友，或让他们从你的 Discord 个人资料加入。他们会直接连接到这台电脑，因此他们能看到这台电脑的地址，你也能看到他们的地址。"
  zh-TW: "把邀請傳給朋友，或讓他們從你的 Discord 個人檔案加入。他們會直接連線到這台電腦，所以他們看得到這台電腦的位址，你也看得到他們的位址。"
  hi: "आमंत्रण अपने दोस्तों को भेजें, या उन्हें अपनी Discord प्रोफ़ाइल से जुड़ने दें। वे सीधे इस कंप्यूटर से जुड़ते हैं, इसलिए वे इसका पता देखते हैं और आप उनका।"
  es: "Envía la invitación a tus amigos o deja que se unan desde tu perfil de Discord. Se conectan directamente a esta computadora, así que ven su dirección y tú ves la de ellos."
  ar: "أرسل الدعوة إلى أصدقائك، أو دعهم ينضمون من ملفك الشخصي على Discord. يتصلون مباشرةً بهذا الكمبيوتر، لذا يرون عنوانه وترى أنت عناوينهم."
  fr: "Envoyez l'invitation à vos amis, ou laissez-les rejoindre depuis votre profil Discord. Ils se connectent directement à cet ordinateur : ils voient son adresse, et vous voyez la leur."
  bn: "আমন্ত্রণটি বন্ধুদের পাঠান, অথবা তাদের আপনার Discord প্রোফাইল থেকে যোগ দিতে দিন। তারা সরাসরি এই কম্পিউটারে সংযুক্ত হয়, তাই তারা এর ঠিকানা দেখতে পায় আর আপনি তাদেরটা।"
  pt-BR: "Envie o convite aos seus amigos ou deixe que entrem pelo seu perfil do Discord. Eles se conectam direto a este computador, então veem o endereço dele, e você vê o deles."
  ru: "Отправьте приглашение друзьям или позвольте им присоединиться через ваш профиль Discord. Они подключаются напрямую к этому компьютеру, поэтому видят его адрес, а вы — их."
  id: "Kirim undangan ke teman Anda, atau biarkan mereka bergabung dari profil Discord Anda. Mereka terhubung langsung ke komputer ini, jadi mereka melihat alamatnya, dan Anda melihat alamat mereka."
  de: "Schick die Einladung an deine Freunde oder lass sie über dein Discord-Profil beitreten. Sie verbinden sich direkt mit diesem Computer, sehen also seine Adresse, und du siehst ihre."
  ja: "招待を友だちに送るか、Discord のプロフィールから参加してもらいましょう。友だちはこのパソコンに直接接続するため、相手にはこのパソコンのアドレスが、あなたには相手のアドレスが見えます。"
  ko: "친구에게 초대를 보내거나 내 Discord 프로필에서 참여하게 하세요. 친구는 이 컴퓨터에 직접 연결되므로 서로의 주소를 볼 수 있습니다."
