  ar: "الرمز المميز في الدعوة تالف."
  fr: "Le jeton de l'invitation est invalide."
  bn: "আমন্ত্রণের টোকেনটি নষ্ট।"
  pt-BR: "O token do convite está corrompido."
  ru: "Токен в приглашении повреждён."
  id: "Token undangan rusak."
