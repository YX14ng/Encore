  zh-CN: "邀请中的地址无效。"
  zh-TW: "邀請中的位址無效。"
  hi: "आमंत्रण का पता खराब है।"
  es: "La dirección de la invitación no es válida."
  ar: "العنوان في الدعوة غير صالح."
