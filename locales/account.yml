  ru: "Адрес в приглашении неверный."
  id: "Alamat undangan tidak valid."
  de: "Die Adresse der Einladung ist ungültig."
  ja: "招待のアドレスが正しくありません。"
  ko: "초대의 주소가 올바르지 않습니다."
