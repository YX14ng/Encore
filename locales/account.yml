  zh-CN: "无法打开端口 %{port}：%{error}"
  zh-TW: "無法開啟連接埠 %{port}：%{error}"
  hi: "पोर्ट %{port} नहीं खुल सका: %{error}"
  es: "No se pudo abrir el puerto %{port}: %{error}"
  ar: "تعذّر فتح المنفذ %{port}: %{error}"
  fr: "Impossible d'ouvrir le port %{port} : %{error}"
  bn: "পোর্ট %{port} খোলা যায়নি: %{error}"
  pt-BR: "Não foi possível abrir a porta %{port}: %{error}"
  ru: "Не удалось открыть порт %{port}: %{error}"
  id: "Tidak dapat membuka port %{port}: %{error}"
  de: "Port %{port} konnte nicht geöffnet werden: %{error}"
  ja: "ポート %{port} を開けませんでした: %{error}"
  ko: "포트 %{port}을(를) 열 수 없습니다: %{error}"
together.invite_too_long:
  en: "That invite is too long."
  zh-CN: "这个邀请太长了。"
  zh-TW: "這個邀請太長了。"
  hi: "यह आमंत्रण बहुत लंबा है।"
  es: "Esa invitación es demasiado larga."
  ar: "هذه الدعوة طويلة جدًا."
  fr: "Cette invitation est trop longue."
  bn: "এই আমন্ত্রণটি খুব লম্বা।"
  pt-BR: "Esse convite é longo demais."
  ru: "Это приглашение слишком длинное."
  id: "Undangan itu terlalu panjang."
  de: "Diese Einladung ist zu lang."
  ja: "この招待は長すぎます。"
  ko: "초대가 너무 깁니다."
together.not_an_invite:
  en: "That is not an Encore invite (it starts with \"encore:\")."
  zh-CN: "这不是 Encore 邀请（Encore 邀请以 \"encore:\" 开头）。"
  zh-TW: "這不是 Encore 邀請（Encore 邀請以 \"encore:\" 開頭）。"
  hi: "यह Encore आमंत्रण नहीं है (यह \"encore:\" से शुरू होता है)।"
  es: "Esa no es una invitación de Encore (empieza con \"encore:\")."
  ar: "هذه ليست دعوة Encore (تبدأ الدعوة بـ \"encore:\")."
  fr: "Ce n'est pas une invitation Encore (elle commence par \"encore:\")."
  bn: "এটি Encore-এর আমন্ত্রণ নয় (এটি \"encore:\" দিয়ে শুরু হয়)।"
  pt-BR: "Isso não é um convite do Encore (ele começa com \"encore:\")."
  ru: "Это не приглашение Encore (оно начинается с \"encore:\")."
  id: "Itu bukan undangan Encore (undangan diawali dengan \"encore:\")."
  de: "Das ist keine Encore-Einladung (sie beginnt mit \"encore:\")."
  ja: "これは Encore の招待ではありません（招待は \"encore:\" で始まります）。"
  ko: "Encore 초대가 아닙니다 (초대는 \"encore:\"로 시작합니다)."
