  ko: "이 세션은 %{days}일째 유지되고 있습니다."
session.lasted_under_a_day:
  en: "The previous session lasted less than a day."
  zh-CN: "上一次登录会话持续不到一天。"
  zh-TW: "上一次登入工作階段持續不到一天。"
  hi: "पिछला सत्र एक दिन से कम चला।"
  es: "La sesión anterior duró menos de un día."
  ar: "استمرت الجلسة السابقة أقل من يوم."
  fr: "La session précédente a duré moins d'un jour."
  bn: "আগের সেশন এক দিনের কম চলেছিল।"
  pt-BR: "A sessão anterior durou menos de um dia."
  ru: "Предыдущий сеанс продлился меньше суток."
  id: "Sesi sebelumnya bertahan kurang dari sehari."
  it: "La sessione precedente è durata meno di un giorno."
  de: "Die vorherige Sitzung hielt weniger als einen Tag."
  ja: "前回のセッションは 1 日未満で切れました。"
  ko: "이전 세션은 하루도 유지되지 않았습니다."
