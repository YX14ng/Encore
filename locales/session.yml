_version: 2
session.working_today:
  en: "This session started today."
  zh-CN: "此登录会话今天开始。"
  zh-TW: "此登入工作階段今天開始。"
  hi: "यह सत्र आज शुरू हुआ।"
  es: "Esta sesión empezó hoy."
  ar: "بدأت هذه الجلسة اليوم."
  fr: "Cette session a commencé aujourd'hui."
  bn: "এই সেশন আজ শুরু হয়েছে।"
  pt-BR: "Esta sessão começou hoje."
  ru: "Этот сеанс начался сегодня."
  id: "Sesi ini dimulai hari ini."
  it: "Questa sessione è iniziata oggi."
  de: "Diese Sitzung hat heute begonnen."
  ja: "このセッションは今日始まりました。"
  ko: "이 세션은 오늘 시작되었습니다."
session.working_one_day:
  en: "This session has worked for 1 day."
  zh-CN: "此登录会话已正常使用 1 天。"
  zh-TW: "此登入工作階段已正常使用 1 天。"
  hi: "यह सत्र 1 दिन से चल रहा है।"
  es: "Esta sesión funciona desde hace 1 día."
  ar: "تعمل هذه الجلسة منذ يوم واحد."
  fr: "Cette session fonctionne depuis 1 jour."
  bn: "এই সেশন ১ দিন ধরে চলছে।"
  pt-BR: "Esta sessão funciona há 1 dia."
  ru: "Этот сеанс работает уже 1 день."
  id: "Sesi ini sudah berjalan 1 hari."
  it: "Questa sessione funziona da 1 giorno."
  de: "Diese Sitzung läuft seit 1 Tag."
  ja: "このセッションは 1 日間使えています。"
  ko: "이 세션은 1일째 유지되고 있습니다."
