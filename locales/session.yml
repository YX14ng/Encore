session.expired_banner:
  en: "Your YouTube Music session expired. What you see is the saved copy of your library until you sign in again."
  zh-CN: "你的 YouTube Music 登录已过期。重新登录前，显示的是媒体库的已保存副本。"
  zh-TW: "你的 YouTube Music 登入已過期。重新登入前，顯示的是媒體庫的已儲存副本。"
  hi: "आपका YouTube Music सत्र समाप्त हो गया है। फिर से साइन इन करने तक आपको अपनी लाइब्रेरी की सहेजी गई कॉपी दिखेगी।"
  es: "Tu sesión de YouTube Music venció. Hasta que vuelvas a iniciar sesión ves la copia guardada de tu biblioteca."
  ar: "انتهت جلستك في YouTube Music. ما تراه هو النسخة المحفوظة من مكتبتك إلى أن تسجّل الدخول مرة أخرى."
  fr: "Votre session YouTube Music a expiré. Vous voyez la copie enregistrée de votre bibliothèque jusqu'à votre prochaine connexion."
  bn: "আপনার YouTube Music সেশনের মেয়াদ শেষ হয়েছে। আবার সাইন ইন না করা পর্যন্ত আপনি লাইব্রেরির সংরক্ষিত কপি দেখছেন।"
  pt-BR: "Sua sessão do YouTube Music expirou. Até você entrar de novo, a biblioteca mostrada é a cópia salva."
  ru: "Сеанс YouTube Music истёк. Пока вы не войдёте снова, показывается сохранённая копия фонотеки."
  id: "Sesi YouTube Music Anda telah berakhir. Sampai Anda login lagi, yang terlihat adalah salinan koleksi yang tersimpan."
  it: "La sessione di YouTube Music è scaduta. Finché non accedi di nuovo, vedi la copia salvata della tua raccolta."
  de: "Deine YouTube Music-Sitzung ist abgelaufen. Bis du dich wieder anmeldest, siehst du die gespeicherte Kopie deiner Mediathek."
  ja: "YouTube Music のセッションが切れました。再ログインするまでは、保存済みのライブラリを表示しています。"
  ko: "YouTube Music 세션이 만료되었습니다. 다시 로그인할 때까지 저장된 보관함 사본이 표시됩니다."
