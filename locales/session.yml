  ar: "تسجيل الدخول مرة أخرى"
  fr: "Se reconnecter"
  bn: "আবার সাইন ইন করুন"
  pt-BR: "Entrar de novo"
  ru: "Войти снова"
  id: "Login lagi"
  it: "Accedi di nuovo"
  de: "Erneut anmelden"
  ja: "再ログイン"
  ko: "다시 로그인"
