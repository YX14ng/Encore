  fr: "Rien n'a encore été téléchargé. Ouvrez un album ou une playlist et cliquez sur Télécharger."
  bn: "এখনো কিছু ডাউনলোড করা হয়নি। একটি অ্যালবাম বা প্লেলিস্ট খুলে “ডাউনলোড করুন” চাপুন।"
