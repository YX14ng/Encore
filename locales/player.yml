audio.compressor_note:
  en: "Evens out the loud and quiet parts inside a song."
  zh-CN: "让歌曲中响亮和轻柔的部分音量更均衡。"
  zh-TW: "讓歌曲中大聲與小聲的段落音量更平均。"
  hi: "गाने के अंदर तेज़ और धीमे हिस्सों को बराबर करता है।"
  es: "Equilibra las partes fuertes y suaves dentro de una canción."
  ar: "يوازن بين الأجزاء الصاخبة والهادئة داخل الأغنية."
  fr: "Équilibre les passages forts et doux d'un même titre."
  bn: "গানের ভেতরের জোরালো আর মৃদু অংশগুলোকে সমান করে।"
  pt-BR: "Equilibra as partes altas e baixas dentro de uma música."
  ru: "Выравнивает громкие и тихие места внутри трека."
  id: "Menyeimbangkan bagian keras dan pelan dalam sebuah lagu."
  it: "Bilancia le parti forti e quelle piano all'interno di un brano."
  de: "Gleicht laute und leise Stellen innerhalb eines Songs aus."
  ja: "1 曲の中の大きな音と小さな音の差をならします。"
  ko: "한 곡 안에서 큰 소리와 작은 소리의 차이를 줄입니다."
