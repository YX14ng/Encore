audio.equalizer_off_note:
  en: "Switch the equalizer on to hear these bands."
  zh-CN: "打开均衡器后才能听到这些频段的效果。"
  zh-TW: "開啟等化器後才能聽到這些頻段的效果。"
  hi: "इन बैंड का असर सुनने के लिए इक्वलाइज़र चालू करें।"
  es: "Activa el ecualizador para escuchar estas bandas."
  ar: "شغّل المعادل الصوتي لتسمع أثر هذه النطاقات."
  fr: "Activez l'égaliseur pour entendre ces bandes."
  bn: "এই ব্যান্ডগুলোর প্রভাব শুনতে ইকুয়ালাইজার চালু করুন।"
  pt-BR: "Ative o equalizador para ouvir estas bandas."
  ru: "Включите эквалайзер, чтобы услышать эти полосы."
  id: "Aktifkan equalizer untuk mendengar pita-pita ini."
  it: "Attiva l'equalizzatore per sentire queste bande."
  de: "Schalte den Equalizer ein, um diese Bänder zu hören."
  ja: "これらの帯域を反映するには、イコライザーをオンにしてください。"
  ko: "이 대역 설정을 적용하려면 이퀄라이저를 켜세요."
audio.filters_refused:
  en: "mpv refused the audio filters %{chain}: %{error}"
  zh-CN: "mpv 拒绝了音频滤镜 %{chain}：%{error}"
  zh-TW: "mpv 拒絕了音訊濾鏡 %{chain}：%{error}"
  hi: "mpv ने ऑडियो फ़िल्टर %{chain} को अस्वीकार किया: %{error}"
  es: "mpv rechazó los filtros de audio %{chain}: %{error}"
  ar: "رفض mpv مرشّحات الصوت %{chain}: %{error}"
  fr: "mpv a refusé les filtres audio %{chain} : %{error}"
  bn: "mpv অডিও ফিল্টার %{chain} প্রত্যাখ্যান করেছে: %{error}"
  pt-BR: "o mpv recusou os filtros de áudio %{chain}: %{error}"
  ru: "mpv отклонил аудиофильтры %{chain}: %{error}"
  id: "mpv menolak filter audio %{chain}: %{error}"
  it: "mpv ha rifiutato i filtri audio %{chain}: %{error}"
  de: "mpv hat die Audiofilter %{chain} abgelehnt: %{error}"
  ja: "mpv がオーディオフィルター %{chain} を受け付けませんでした: %{error}"
  ko: "mpv가 오디오 필터 %{chain}을(를) 거부했습니다: %{error}"
audio.keep_pitch:
  en: "Keep the pitch when changing speed"
  zh-CN: "变速时保持音调"
  zh-TW: "變速時保持音高"
  hi: "स्पीड बदलने पर पिच बनाए रखें"
  es: "Mantener el tono al cambiar la velocidad"
  ar: "الحفاظ على طبقة الصوت عند تغيير السرعة"
  fr: "Conserver la hauteur du son en changeant la vitesse"
  bn: "গতি বদলালেও পিচ ঠিক রাখুন"
  pt-BR: "Manter o tom ao mudar a velocidade"
  ru: "Сохранять высоту тона при изменении скорости"
  id: "Pertahankan nada saat mengubah kecepatan"
  it: "Mantieni l'intonazione quando cambi la velocità"
  de: "Tonhöhe beim Ändern der Geschwindigkeit beibehalten"
  ja: "速度を変えても音程を保つ"
  ko: "속도를 바꿔도 음높이 유지"
audio.normalize:
  en: "Normalize volume"
  zh-CN: "音量标准化"
  zh-TW: "音量正規化"
  hi: "वॉल्यूम सामान्य करें"
  es: "Normalizar volumen"
  ar: "توحيد مستوى الصوت"
  fr: "Normaliser le volume"
  bn: "ভলিউম সমান রাখুন"
  pt-BR: "Normalizar volume"
  ru: "Нормализация громкости"
  id: "Normalisasi volume"
  it: "Normalizza il volume"
  de: "Lautstärke normalisieren"
  ja: "音量を均一にする"
  ko: "음량 평준화"
audio.normalize_note:
  en: "Plays every song at about the same loudness, so quiet and loud tracks match."
  zh-CN: "让每首歌以大致相同的响度播放，安静和响亮的歌曲听起来一致。"
  zh-TW: "讓每首歌以大致相同的響度播放，小聲和大聲的歌曲聽起來一致。"
  hi: "हर गाना लगभग एक जैसी आवाज़ में बजता है, ताकि धीमे और तेज़ ट्रैक बराबर लगें।"
  es: "Reproduce cada canción con un volumen parecido, para que las pistas suaves y fuertes suenen parejas."
  ar: "يشغّل كل أغنية بارتفاع صوت متقارب، فتتساوى المقاطع الهادئة والصاخبة."
  fr: "Lit chaque titre à un volume à peu près identique, pour que les morceaux calmes et forts s'équilibrent."
  bn: "প্রতিটি গান প্রায় একই জোরে বাজায়, যাতে মৃদু আর জোরালো ট্র্যাক সমান শোনায়।"
  pt-BR: "Toca cada música com volume parecido, para que faixas baixas e altas fiquem equilibradas."
  ru: "Все треки звучат примерно одинаково громко: тихие и громкие выравниваются."
  id: "Memutar setiap lagu dengan kenyaringan yang kurang lebih sama, sehingga lagu pelan dan keras terdengar seimbang."
  it: "Riproduce tutti i brani a un volume simile, così quelli più bassi e quelli più forti si equilibrano."
  de: "Spielt jeden Song in etwa gleich laut ab, damit leise und laute Titel zusammenpassen."
  ja: "すべての曲をほぼ同じ音量で再生し、小さい曲と大きい曲の差をなくします。"
  ko: "모든 곡을 비슷한 음량으로 재생해 소리가 작은 곡과 큰 곡의 차이를 없앱니다."
