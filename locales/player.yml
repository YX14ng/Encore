  id: "Menampilkan batang yang bergerak mengikuti musik di bawah lirik dalam tampilan layar penuh."
  it: "Mostra sotto il testo, nella vista a schermo intero, delle barre che si muovono a ritmo di musica."
  de: "Zeigt in der Vollbildansicht unter dem Songtext Balken, die sich mit der Musik bewegen."
