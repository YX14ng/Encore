audio.crossfade_note:
  en: "Fades the end of each song into the start of the next one."
  zh-CN: "让每首歌的结尾渐渐过渡到下一首的开头。"
  zh-TW: "讓每首歌的結尾逐漸過渡到下一首的開頭。"
  hi: "हर गाने के अंत को अगले गाने की शुरुआत में धीरे-धीरे मिलाता है।"
  es: "Funde el final de cada canción con el comienzo de la siguiente."
  ar: "يمزج نهاية كل أغنية تدريجيًا مع بداية الأغنية التالية."
  fr: "Fond la fin de chaque titre dans le début du suivant."
  bn: "প্রতিটি গানের শেষটা ধীরে ধীরে পরের গানের শুরুতে মিশিয়ে দেয়।"
  pt-BR: "Mistura o fim de cada música com o começo da próxima."
  ru: "Плавно сводит конец каждого трека с началом следующего."
  id: "Memudarkan akhir setiap lagu ke awal lagu berikutnya."
  it: "Sfuma la fine di ogni brano nell'inizio di quello successivo."
  de: "Blendet das Ende jedes Songs in den Anfang des nächsten über."
  ja: "曲の終わりと次の曲の始まりを重ねて、なめらかにつなぎます。"
  ko: "각 곡의 끝을 다음 곡의 시작과 자연스럽게 이어 줍니다."
