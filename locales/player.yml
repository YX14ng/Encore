plugins.skip_disliked_description:
  en: "Skips a song when you dislike it, and songs you disliked before when they come up (signed in)."
  zh-CN: "点了“不喜欢”的歌曲会被立即跳过，之前不喜欢的歌曲再次出现时也会被跳过（需登录）。"
  zh-TW: "按下「不喜歡」的歌曲會立即略過，先前不喜歡的歌曲再次出現時也會略過（需登入）。"
  hi: "किसी गाने को नापसंद करते ही उसे छोड़ देता है, और पहले नापसंद किए गए गाने आने पर उन्हें भी छोड़ देता है (साइन इन होने पर)।"
  es: "Omite una canción cuando marcas que no te gusta, y también las que marcaste antes cuando vuelven a aparecer (con sesión iniciada)."
  ar: "يتخطّى الأغنية عندما تضغط «لا يعجبني»، والأغاني التي لم تعجبك من قبل عندما تظهر مجددًا (بعد تسجيل الدخول)."
  fr: "Passe un titre dès que vous indiquez ne pas l'aimer, ainsi que ceux que vous n'aimiez déjà pas quand ils reviennent (connecté)."
  bn: "কোনো গান অপছন্দ করলে সেটি বাদ দেয়, আর আগে অপছন্দ করা গান আবার এলে সেগুলোও বাদ দেয় (সাইন ইন করা থাকলে)।"
  pt-BR: "Pula uma música quando você marca que não gostou e também as que você já marcou quando elas aparecem de novo (conectado)."
  ru: "Пропускает трек, когда вы ставите ему дизлайк, а также треки с дизлайком, когда они снова попадаются (нужен вход)."
  id: "Melewati lagu saat Anda tidak menyukainya, juga lagu yang sebelumnya tidak Anda sukai saat muncul lagi (sudah login)."
  it: "Salta un brano quando metti Non mi piace e, quando ricompaiono, quelli a cui l'avevi già messo (con accesso eseguito)."
  de: "Überspringt einen Song, sobald du ihn mit „Mag ich nicht“ markierst, und früher so markierte Songs, wenn sie wieder auftauchen (angemeldet)."
  ja: "低評価した曲をすぐにスキップし、以前に低評価した曲が流れたときもスキップします（ログイン時）。"
  ko: "싫어요를 표시하면 곡을 바로 건너뛰고, 전에 싫어요 표시한 곡이 다시 나올 때도 건너뜁니다(로그인 시)."
