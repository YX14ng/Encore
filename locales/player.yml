  de: "Hoch (Premium)"
  ja: "高（Premium）"
  ko: "높음 (Premium)"
audio.quality_high_note:
  en: "Opus around 256 kbit/s with YouTube Music Premium (signed in); without Premium it is the same as Normal. yt-dlp downloads with your session, which YouTube may notice: yt-dlp warns that accounts used this way can get blocked for a while."
  zh-CN: "开通 YouTube Music Premium（需登录）时为 Opus 约 256 kbit/s；未开通 Premium 时与“标准”相同。yt-dlp 会使用你的登录会话下载，YouTube 可能会察觉：yt-dlp 提醒，这样使用的账号可能会被暂时封禁。"
  zh-TW: "訂閱 YouTube Music Premium（需登入）時為 Opus 約 256 kbit/s；未訂閱 Premium 時與「標準」相同。yt-dlp 會使用你的登入工作階段下載，YouTube 可能會察覺：yt-dlp 提醒，以這種方式使用的帳戶可能會被暫時封鎖。"
  hi: "YouTube Music Premium (साइन इन) के साथ लगभग 256 kbit/s का Opus; Premium के बिना यह \"सामान्य\" जैसा ही है। yt-dlp आपके सेशन से डाउनलोड करता है, जिस पर YouTube का ध्यान जा सकता है: yt-dlp चेतावनी देता है कि इस तरह इस्तेमाल किए गए खाते कुछ समय के लिए ब्लॉक हो सकते हैं।"
  es: "Opus a unos 256 kbit/s con YouTube Music Premium (con sesión iniciada); sin Premium es igual que Normal. yt-dlp descarga con tu sesión, y YouTube podría notarlo: yt-dlp advierte que las cuentas usadas así pueden quedar bloqueadas por un tiempo."
  ar: "Opus بنحو 256 kbit/s مع YouTube Music Premium (بعد تسجيل الدخول)، وبدون Premium تكون مثل الجودة العادية. يُنزّل yt-dlp باستخدام جلستك، وقد يلاحظ YouTube ذلك: إذ يحذّر yt-dlp من أن الحسابات المستخدمة بهذه الطريقة قد تُحظر لبعض الوقت."
  fr: "Opus à environ 256 kbit/s avec YouTube Music Premium (connecté) ; sans Premium, c'est la même chose que Normale. yt-dlp télécharge avec votre session, ce que YouTube peut remarquer : yt-dlp prévient que les comptes utilisés ainsi peuvent être bloqués pendant un certain temps."
  bn: "YouTube Music Premium (সাইন ইন করা) থাকলে প্রায় 256 kbit/s-এর Opus; Premium ছাড়া এটি \"সাধারণ\"-এর মতোই। yt-dlp আপনার সেশন দিয়ে ডাউনলোড করে, যা YouTube লক্ষ করতে পারে: yt-dlp সতর্ক করে যে এভাবে ব্যবহৃত অ্যাকাউন্ট কিছু সময়ের জন্য ব্লক হতে পারে।"
  pt-BR: "Opus a cerca de 256 kbit/s com o YouTube Music Premium (conectado); sem Premium, é igual à Normal. O yt-dlp baixa com a sua sessão, o que o YouTube pode perceber: o yt-dlp avisa que contas usadas assim podem ser bloqueadas por um tempo."
  ru: "Opus около 256 кбит/с с YouTube Music Premium (нужен вход); без Premium — то же, что «Обычное». yt-dlp скачивает через ваш сеанс, и YouTube может это заметить: yt-dlp предупреждает, что такие аккаунты могут временно заблокировать."
  id: "Opus sekitar 256 kbit/s dengan YouTube Music Premium (sudah login); tanpa Premium sama dengan Normal. yt-dlp mengunduh dengan sesi Anda, yang mungkin disadari YouTube: yt-dlp memperingatkan bahwa akun yang dipakai seperti ini bisa diblokir untuk sementara."
  it: "Opus a circa 256 kbit/s con YouTube Music Premium (con accesso eseguito); senza Premium equivale a Normale. yt-dlp scarica con la tua sessione e YouTube potrebbe accorgersene: yt-dlp avverte che gli account usati in questo modo possono essere bloccati per un po'."
  de: "Opus mit etwa 256 kbit/s mit YouTube Music Premium (angemeldet); ohne Premium wie Normal. yt-dlp lädt mit deiner Sitzung herunter, was YouTube bemerken kann: yt-dlp warnt, dass so genutzte Konten eine Zeit lang gesperrt werden können."
  ja: "YouTube Music Premium（ログイン時）では約 256 kbit/s の Opus、Premium なしでは「標準」と同じです。yt-dlp はあなたのセッションでダウンロードするため、YouTube に気付かれる可能性があります。yt-dlp によると、この方法で使ったアカウントは一時的にブロックされることがあります。"
  ko: "YouTube Music Premium(로그인 시)에서는 약 256kbit/s Opus이며, Premium이 없으면 '보통'과 같습니다. yt-dlp는 내 세션으로 다운로드하므로 YouTube가 이를 알아챌 수 있습니다. yt-dlp는 이렇게 사용한 계정이 한동안 차단될 수 있다고 경고합니다."
