queue.empty:
  en: "Play a song, an album or a playlist to fill the queue, and add songs to it with the + next to any song."
  zh-CN: "播放一首歌曲、一张专辑或一个播放列表来填充队列，也可以点击任意歌曲旁的 + 把它加入队列。"
  zh-TW: "播放一首歌曲、一張專輯或一個播放清單來填滿佇列，也可以點選任何歌曲旁的 + 把它加入佇列。"
  hi: "कतार भरने के लिए कोई गाना, एल्बम या प्लेलिस्ट चलाएँ, और किसी भी गाने के पास वाले + से उसमें गाने जोड़ें।"
  es: "Reproduce una canción, un álbum o una playlist para llenar la fila, y agrega canciones con el + junto a cualquier canción."
  ar: "شغّل أغنية أو ألبومًا أو قائمة تشغيل لملء قائمة الانتظار، وأضف إليها أغاني بزر + بجانب أي أغنية."
  fr: "Lancez un titre, un album ou une playlist pour remplir la file d'attente, et ajoutez-y des titres avec le + à côté de chacun."
  bn: "সারি ভরাতে একটি গান, অ্যালবাম বা প্লেলিস্ট চালান, আর যেকোনো গানের পাশের + দিয়ে তাতে গান যোগ করুন।"
  pt-BR: "Toque uma música, um álbum ou uma playlist para preencher a fila e adicione músicas com o + ao lado de qualquer música."
  ru: "Включите трек, альбом или плейлист, чтобы заполнить очередь, и добавляйте в неё треки кнопкой + рядом с любым треком."
  id: "Putar lagu, album, atau playlist untuk mengisi antrean, lalu tambahkan lagu dengan tombol + di samping lagu mana pun."
  it: "Riproduci un brano, un album o una playlist per riempire la coda, e aggiungi brani con il + accanto a qualsiasi brano."
  de: "Spiele einen Song, ein Album oder eine Playlist ab, um die Warteschlange zu füllen, und füge mit dem + neben jedem Song weitere hinzu."
  ja: "曲、アルバム、プレイリストを再生するとキューに入ります。各曲の横にある + で曲を追加することもできます。"
  ko: "곡, 앨범 또는 재생목록을 재생해 대기열을 채우고, 곡 옆의 +를 눌러 곡을 추가하세요."
