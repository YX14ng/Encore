plugins.notifications_description:
  en: "Shows a notification with the cover when a song starts."
  zh-CN: "歌曲开始播放时显示带封面的通知。"
  zh-TW: "歌曲開始播放時顯示附有封面的通知。"
  hi: "गाना शुरू होने पर कवर के साथ सूचना दिखाता है।"
  es: "Muestra una notificación con la portada cuando empieza una canción."
  ar: "يعرض إشعارًا مع صورة الغلاف عند بدء الأغنية."
  fr: "Affiche une notification avec la pochette au début de chaque titre."
  bn: "গান শুরু হলে কভারসহ একটি বিজ্ঞপ্তি দেখায়।"
  pt-BR: "Mostra uma notificação com a capa quando uma música começa."
  ru: "Показывает уведомление с обложкой, когда начинается трек."
  id: "Menampilkan notifikasi dengan sampul saat lagu dimulai."
  it: "Mostra una notifica con la copertina quando inizia un brano."
  de: "Zeigt beim Start eines Songs eine Benachrichtigung mit dem Cover."
  ja: "曲が始まるとジャケット付きの通知を表示します。"
  ko: "곡이 시작되면 커버와 함께 알림을 표시합니다."
