plugins.visualizer_description:
  en: "Shows bars that move with the music under the lyrics in the full screen view."
  zh-CN: "在全屏视图的歌词下方显示随音乐跳动的频谱条。"
  zh-TW: "在全螢幕檢視的歌詞下方顯示隨音樂跳動的頻譜條。"
  hi: "फ़ुल स्क्रीन व्यू में बोल के नीचे संगीत के साथ हिलने वाली पट्टियाँ दिखाता है।"
  es: "Muestra barras que se mueven con la música debajo de la letra en la vista de pantalla completa."
