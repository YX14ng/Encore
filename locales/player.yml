plugins.lastfm_description:
  en: "Scrobbles the songs you play to Last.fm (connect your account on the account screen)."
  zh-CN: "把你播放的歌曲记录到 Last.fm（在账号页面连接你的账号）。"
  zh-TW: "把你播放的歌曲記錄到 Last.fm（在帳戶頁面連結你的帳戶）。"
  hi: "आप जो गाने चलाते हैं, उन्हें Last.fm पर स्क्रॉबल करता है (खाता स्क्रीन पर अपना खाता कनेक्ट करें)।"
  es: "Registra en Last.fm las canciones que reproduces (conecta tu cuenta en la pantalla de cuenta)."
  ar: "يسجّل الأغاني التي تشغّلها في Last.fm (اربط حسابك من شاشة الحساب)."
  fr: "Envoie les titres que vous écoutez à Last.fm (connectez votre compte depuis l'écran du compte)."
  bn: "আপনি যে গান চালান সেগুলো Last.fm-এ স্ক্রবল করে (অ্যাকাউন্ট স্ক্রিনে আপনার অ্যাকাউন্ট সংযুক্ত করুন)।"
  pt-BR: "Registra no Last.fm as músicas que você toca (conecte sua conta na tela da conta)."
  ru: "Отправляет прослушанные треки в Last.fm (подключите аккаунт в разделе «Аккаунт»)."
  id: "Mencatat lagu yang Anda putar ke Last.fm (hubungkan akun Anda di layar akun)."
  it: "Fa lo scrobbling su Last.fm dei brani che ascolti (collega il tuo account nella schermata Account)."
  de: "Scrobbelt die Songs, die du hörst, zu Last.fm (verbinde dein Konto auf der Kontoseite)."
  ja: "再生した曲を Last.fm に Scrobble します（アカウント画面で Last.fm と連携してください）。"
  ko: "재생한 곡을 Last.fm에 스크로블합니다(계정 화면에서 계정을 연결하세요)."
