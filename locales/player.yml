  de: "Stille überspringen"
  ja: "無音をスキップ"
  ko: "무음 건너뛰기"
audio.skip_silence_note:
  en: "Starts songs where the music starts and ends them where it ends. Silences inside a song stay. Takes effect from the next song."
  zh-CN: "从音乐真正开始的地方播放，在音乐结束的地方停止。歌曲中间的静音会保留。从下一首歌曲开始生效。"
  zh-TW: "從音樂真正開始的地方播放，在音樂結束的地方停止。歌曲中間的靜音會保留。從下一首歌曲開始生效。"
  hi: "गाने वहीं से शुरू होते हैं जहाँ संगीत शुरू होता है और वहीं खत्म होते हैं जहाँ संगीत खत्म होता है। गाने के बीच की ख़ामोशी बनी रहती है। अगले गाने से लागू होगा।"
  es: "Empieza las canciones donde empieza la música y las termina donde termina. Los silencios dentro de una canción se mantienen. Se aplica desde la próxima canción."
  ar: "يبدأ الأغاني حيث تبدأ الموسيقى وينهيها حيث تنتهي. يبقى الصمت داخل الأغنية كما هو. يسري بدءًا من الأغنية التالية."
  fr: "Commence les titres là où la musique commence et les termine là où elle s'arrête. Les silences à l'intérieur d'un titre sont conservés. S'applique à partir du titre suivant."
  bn: "যেখানে সংগীত শুরু হয় সেখান থেকে গান শুরু করে, আর যেখানে শেষ হয় সেখানে থামায়। গানের মাঝের নীরবতা থেকে যায়। পরের গান থেকে কার্যকর হবে।"
  pt-BR: "Começa cada faixa quando o som começa e termina quando ele acaba. Silêncios no meio da faixa continuam. Vale a partir da próxima música."
  ru: "Треки начинаются там, где начинается музыка, и заканчиваются там, где она заканчивается. Тишина внутри трека сохраняется. Вступит в силу со следующего трека."
  id: "Memulai lagu saat musiknya mulai dan mengakhirinya saat musiknya berakhir. Jeda senyap di tengah lagu tetap ada. Berlaku mulai lagu berikutnya."
  it: "Fa iniziare i brani dove inizia la musica e li fa finire dove finisce. I silenzi all'interno di un brano restano. Si applica dal brano successivo."
  de: "Startet Songs dort, wo die Musik beginnt, und beendet sie dort, wo sie endet. Stille innerhalb eines Songs bleibt erhalten. Gilt ab dem nächsten Song."
  ja: "音楽が始まる位置から曲を再生し、音楽が終わる位置で止めます。曲の途中の無音はそのまま残ります。次の曲から適用されます。"
  ko: "음악이 시작되는 곳에서 곡을 시작하고 음악이 끝나는 곳에서 끝냅니다. 곡 중간의 무음은 그대로 둡니다. 다음 곡부터 적용됩니다."
