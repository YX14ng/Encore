plugins.sponsorblock_description:
  en: "Skips the parts of music videos that are not music (intros, skits, outros), as marked by the SponsorBlock community."
  zh-CN: "跳过音乐视频中不是音乐的部分（开场、小品、片尾），以 SponsorBlock 社区的标记为准。"
  zh-TW: "略過音樂影片中不是音樂的段落（開場、短劇、片尾），以 SponsorBlock 社群的標記為準。"
  hi: "म्यूज़िक वीडियो के वे हिस्से छोड़ देता है जो संगीत नहीं हैं (इंट्रो, स्किट, आउट्रो), जैसा SponsorBlock समुदाय ने चिह्नित किया है।"
  es: "Omite las partes de los videos musicales que no son música (intros, sketches, cierres), según las marca la comunidad de SponsorBlock."
  ar: "يتخطّى أجزاء الفيديوهات الموسيقية التي ليست موسيقى (المقدمات والمشاهد التمثيلية والخواتيم)، كما حدّدها مجتمع SponsorBlock."
  fr: "Passe les parties des clips qui ne sont pas de la musique (intros, sketches, outros), selon les repères de la communauté SponsorBlock."
  bn: "মিউজিক ভিডিওর যেসব অংশ সংগীত নয় (ইন্ট্রো, স্কিট, আউট্রো), SponsorBlock কমিউনিটির চিহ্ন অনুযায়ী সেগুলো বাদ দেয়।"
  pt-BR: "Pula as partes dos videoclipes que não são música (introduções, esquetes, encerramentos), conforme marcadas pela comunidade do SponsorBlock."
  ru: "Пропускает части клипов без музыки (вступления, сценки, концовки), отмеченные сообществом SponsorBlock."
  id: "Melewati bagian video musik yang bukan musik (intro, sketsa, outro), sesuai tanda dari komunitas SponsorBlock."
  it: "Salta le parti dei video musicali che non sono musica (intro, scenette, outro), segnalate dalla community di SponsorBlock."
  de: "Überspringt die Teile von Musikvideos, die keine Musik sind (Intros, Sketche, Outros), wie von der SponsorBlock-Community markiert."
  ja: "SponsorBlock コミュニティが指定した、ミュージック ビデオ内の音楽以外の部分（イントロ、スキット、アウトロ）をスキップします。"
  ko: "SponsorBlock 커뮤니티가 표시한 뮤직비디오의 음악이 아닌 부분(인트로, 스킷, 아웃트로)을 건너뜁니다."
