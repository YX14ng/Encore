plugins.discord_description:
  en: "Shows the song you are listening to on your Discord profile."
  zh-CN: "在你的 Discord 个人资料上显示你正在听的歌曲。"
  zh-TW: "在你的 Discord 個人檔案上顯示你正在聽的歌曲。"
  hi: "आप जो गाना सुन रहे हैं, उसे आपकी Discord प्रोफ़ाइल पर दिखाता है।"
  es: "Muestra en tu perfil de Discord la canción que estás escuchando."
  ar: "يعرض الأغنية التي تستمع إليها في ملفك الشخصي على Discord."
  fr: "Affiche le titre que vous écoutez sur votre profil Discord."
  bn: "আপনি যে গান শুনছেন তা আপনার Discord প্রোফাইলে দেখায়।"
  pt-BR: "Mostra a música que você está ouvindo no seu perfil do Discord."
  ru: "Показывает в вашем профиле Discord трек, который вы слушаете."
  id: "Menampilkan lagu yang sedang Anda dengarkan di profil Discord Anda."
  it: "Mostra nel tuo profilo Discord il brano che stai ascoltando."
  de: "Zeigt den Song, den du gerade hörst, in deinem Discord-Profil."
  ja: "聴いている曲を Discord のプロフィールに表示します。"
  ko: "듣고 있는 곡을 Discord 프로필에 표시합니다."
