[package]
name = "encore"
version = "0.7.0"
edition = "2024"
description = "A YouTube Music player for the desktop"
repository = "https://github.com/YX14ng/Encore"
license = "GPL-3.0-or-later"

[dependencies]
chrono = "0.4"
discord-rich-presence = "1.1"
fastrand = "2"
getrandom = "0.3"
iced = { version = "0.14", features = ["tokio", "image", "svg", "advanced"] }
image = "0.25.10"
libmpv2 = "7"
# Japanese word splitting with readings, for romanized lyrics. The IPADIC dictionary is
# downloaded once when building and embedded in the binary.
lindera = { version = "6", features = ["embed-ipadic"] }
rustfft = "6"
rust-i18n = "3"
md5 = "0.8"
notify-rust = { version = "4", default-features = false, features = ["z-with-tokio"] }
pinyin = { version = "0.11", default-features = false, features = ["with_tone"] }
reqwest = "0.12"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
# Encore's fork: upstream's main plus fixes it needs (its "encore" branch).
rustypipe = { git = "https://github.com/YX14ng/rustypipe.git", branch = "encore", features = ["userdata"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
tokio = { version = "1", features = ["process", "fs", "macros", "rt-multi-thread"] }

# Gives encore.exe its icon on Windows (see build.rs).
[build-dependencies]
winresource = "0.1"

# The sign-in window: WebKitGTK on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
soup3 = "0.5"
webkit2gtk = { version = "2", features = ["v2_40"] }

# The sign-in window (WebView2) and Discord's named pipe on Windows.
[target.'cfg(windows)'.dependencies]
tao = { version = "0.35", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }
wry = { version = "0.55", default-features = false }

# Linux packages (see .github/workflows/release.yml). The package is "encore-ytm": "encore" is
# another player's name in the distributions.
[package.metadata.deb]
name = "encore-ytm"
maintainer = "YX14ng <173115510+YX14ng@users.noreply.github.com>"
copyright = "YX14ng"
license-file = ["LICENSE", "0"]
section = "sound"
extended-description = """\
A desktop player for YouTube Music with synced and romanized lyrics, an equalizer, crossfade, \
a true random shuffle, music videos, Discord status, Last.fm scrobbling and listening together. \
Songs download with yt-dlp, which needs a recent version and a JavaScript runtime (deno)."""
depends = "$auto, ffmpeg"
recommends = "yt-dlp"
assets = [
    ["target/release/encore", "usr/bin/", "755"],
    ["packaging/io.github.yx14ng.Encore.desktop", "usr/share/applications/", "644"],
    ["packaging/io.github.yx14ng.Encore.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/app/io.github.yx14ng.Encore.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/app/hicolor/16x16/io.github.yx14ng.Encore.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["assets/app/hicolor/24x24/io.github.yx14ng.Encore.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["assets/app/hicolor/32x32/io.github.yx14ng.Encore.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["assets/app/hicolor/48x48/io.github.yx14ng.Encore.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["assets/app/hicolor/64x64/io.github.yx14ng.Encore.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["assets/app/hicolor/128x128/io.github.yx14ng.Encore.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["assets/app/hicolor/256x256/io.github.yx14ng.Encore.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["assets/app/hicolor/512x512/io.github.yx14ng.Encore.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["THIRD_PARTY.md", "usr/share/doc/encore-ytm/", "644"],
    ["licenses/IPADIC.txt", "usr/share/doc/encore-ytm/", "644"],
]

[package.metadata.generate-rpm]
name = "encore-ytm"
summary = "Desktop player for YouTube Music, with synced lyrics"
assets = [
    { source = "target/release/encore", dest = "/usr/bin/encore", mode = "755" },
    { source = "packaging/io.github.yx14ng.Encore.desktop", dest = "/usr/share/applications/io.github.yx14ng.Encore.desktop", mode = "644" },
    { source = "packaging/io.github.yx14ng.Encore.metainfo.xml", dest = "/usr/share/metainfo/io.github.yx14ng.Encore.metainfo.xml", mode = "644" },
    { source = "assets/app/io.github.yx14ng.Encore.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.yx14ng.Encore.svg", mode = "644" },
    { source = "assets/app/hicolor/16x16/io.github.yx14ng.Encore.png", dest = "/usr/share/icons/hicolor/16x16/apps/io.github.yx14ng.Encore.png", mode = "644" },
    { source = "assets/app/hicolor/24x24/io.github.yx14ng.Encore.png", dest = "/usr/share/icons/hicolor/24x24/apps/io.github.yx14ng.Encore.png", mode = "644" },
    { source = "assets/app/hicolor/32x32/io.github.yx14ng.Encore.png", dest = "/usr/share/icons/hicolor/32x32/apps/io.github.yx14ng.Encore.png", mode = "644" },
    { source = "assets/app/hicolor/48x48/io.github.yx14ng.Encore.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.github.yx14ng.Encore.png", mode = "644" },
    { source = "assets/app/hicolor/64x64/io.github.yx14ng.Encore.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.github.yx14ng.Encore.png", mode = "644" },
    { source = "assets/app/hicolor/128x128/io.github.yx14ng.Encore.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.yx14ng.Encore.png", mode = "644" },
    { source = "assets/app/hicolor/256x256/io.github.yx14ng.Encore.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.yx14ng.Encore.png", mode = "644" },
    { source = "assets/app/hicolor/512x512/io.github.yx14ng.Encore.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github.yx14ng.Encore.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/encore-ytm/LICENSE", mode = "644", doc = true },
    { source = "THIRD_PARTY.md", dest = "/usr/share/licenses/encore-ytm/THIRD_PARTY.md", mode = "644", doc = true },
    { source = "licenses/IPADIC.txt", dest = "/usr/share/licenses/encore-ytm/IPADIC.txt", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
yt-dlp = "*"
"/usr/bin/ffmpeg" = "*"

[lints.clippy]
unwrap_used = "deny"


[dev-dependencies]
serde_yaml = "0.9"

[profile.release]
# Release binaries without debug symbols: smaller packages.
strip = true
