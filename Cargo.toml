[package]
name = "encore"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
iced = { version = "0.14", features = ["tokio", "image", "svg"] }
image = "0.25.10"
libmpv2 = "7"
reqwest = "0.12"
rustypipe = { version = "0.11", features = ["userdata"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
tokio = { version = "1", features = ["process", "fs", "macros", "rt-multi-thread"] }

[lints.clippy]
unwrap_used = "deny"
