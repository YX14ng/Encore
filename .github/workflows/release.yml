# Builds Encore's Linux packages when a version tag (v0.1.0) is pushed, and attaches them to the
# GitHub release of that tag: the binary as .tar.gz and the .deb on Ubuntu 24.04 (the base of
# Linux Mint 22), the .rpm on Fedora.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libmpv-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Package the binary
        run: |
          name=encore-${GITHUB_REF_NAME#v}-x86_64-linux
          mkdir -p "$name"
          cp target/release/encore LICENSE THIRD_PARTY.md "$name/"
          cp -r packaging assets/app licenses "$name/"
          tar -czf "$name.tar.gz" "$name"
      - name: Package the .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --no-strip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            encore-*.tar.gz
            target/debian/*.deb

  fedora:
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git gcc pkgconf-pkg-config gtk3-devel webkit2gtk4.1-devel libsoup3-devel mpv-devel rpm-build
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Package the .rpm
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/generate-rpm/*.rpm
